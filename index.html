<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;overflow:hidden;font:12px "Segoe UI",Tahoma,Arial,sans-serif;color:#000}
body,.p0{background:radial-gradient(ellipse 70% 60% at 50% 62%,#8fe0ff,#3aa3e3 28%,#0f58b0 62%,#06306a)}

body.w3,.p3{background:linear-gradient(160deg,#0d1b2e,#27496d 50%,#0a1220)}
body::before{content:"";position:fixed;inset:0;background:conic-gradient(from 200deg at 50% 75%,transparent 0 8deg,rgba(255,255,255,.14) 14deg,transparent 24deg 40deg,rgba(255,255,255,.1) 48deg,transparent 60deg 90deg,rgba(255,255,255,.12) 100deg,transparent 112deg);filter:blur(6px);pointer-events:none}
svg{display:block;flex:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}

.win{position:absolute;display:flex;flex-direction:column;padding:0 7px 7px;max-width:100vw;max-height:calc(100vh - 40px);border-radius:8px 8px 0 0;border:1px solid rgba(0,0,0,.62);background:linear-gradient(rgba(214,224,238,.8),rgba(188,204,226,.8));backdrop-filter:blur(8px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 8px 28px rgba(0,0,0,.5);animation:pop .14s ease-out;transition:opacity .2s}

.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win.out{animation:out .13s forwards}
@keyframes pop{from{opacity:0;transform:scale(.94)}}

.peek .win{opacity:.1!important;pointer-events:none}
.tb{height:30px;display:flex;align-items:center;gap:6px;flex:none}
