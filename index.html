<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 7</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;overflow:hidden;font:12px "Segoe UI",Tahoma,Arial,sans-serif;color:#000}
body,.p0{background:radial-gradient(ellipse 70% 60% at 50% 62%,#8fe0ff,#3aa3e3 28%,#0f58b0 62%,#06306a)}
body.w1,.p1{background:radial-gradient(ellipse 80% 70% at 30% 70%,#d9f7a8,#4fb37a 35%,#0f6b6e 70%,#04323f)}
body.w2,.p2{background:radial-gradient(ellipse 80% 70% at 70% 80%,#ffd29a,#e8704a 30%,#7a2f7c 65%,#1d1240)}
body.w3,.p3{background:linear-gradient(160deg,#0d1b2e,#27496d 50%,#0a1220)}
body::before{content:"";position:fixed;inset:0;background:conic-gradient(from 200deg at 50% 75%,transparent 0 8deg,rgba(255,255,255,.14) 14deg,transparent 24deg 40deg,rgba(255,255,255,.1) 48deg,transparent 60deg 90deg,rgba(255,255,255,.12) 100deg,transparent 112deg);filter:blur(6px);pointer-events:none}
svg{display:block;flex:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
#desk{position:fixed;inset:0 0 40px 0;transition:opacity .15s}
#icons{position:absolute;inset:0;transition:opacity .12s}
.ic{position:absolute;width:76px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;color:#fff;text-shadow:0 1px 3px #000,0 0 3px #000;border:1px solid transparent;border-radius:3px}
.ic.sel{background:rgba(120,180,255,.3);border-color:rgba(190,225,255,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.win{position:absolute;display:flex;flex-direction:column;padding:0 7px 7px;max-width:100vw;max-height:calc(100vh - 40px);border-radius:8px 8px 0 0;border:1px solid rgba(0,0,0,.62);background:linear-gradient(rgba(214,224,238,.8),rgba(188,204,226,.8));backdrop-filter:blur(8px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 8px 28px rgba(0,0,0,.5);animation:pop .14s ease-out;transition:opacity .2s}
.win.on{background:linear-gradient(110deg,rgba(255,255,255,.3) 18%,transparent 18.2% 52%,rgba(255,255,255,.15) 52.2%) 0 0/100% 34px no-repeat,linear-gradient(rgba(143,189,235,.72),rgba(107,160,222,.7) 40%,rgba(120,170,226,.72));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 10px 36px rgba(0,0,0,.6)}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win.out{animation:out .13s forwards}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes out{to{opacity:0;transform:scale(.92) translateY(24px)}}
.peek .win{opacity:.1!important;pointer-events:none}
.tb{height:30px;display:flex;align-items:center;gap:6px;flex:none}
.tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 0 8px #fff,0 0 5px #fff,0 0 3px #fff}
.win:not(.on) .tt{color:#555}
.btns{display:flex;align-self:flex-start;margin-right:-4px}
.btns b{height:19px;width:28px;display:grid;place-items:center;font:700 11px "Segoe UI";color:#223;border:1px solid rgba(0,0,0,.55);border-top:0;margin-left:-1px;background:linear-gradient(rgba(240,246,252,.85),rgba(190,208,230,.7) 48%,rgba(150,175,208,.75) 52%,rgba(190,215,238,.8));box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.btns b:first-child{border-radius:0 0 0 5px}
.btns .cl{width:47px;border-radius:0 0 5px 0;color:#fff;text-shadow:0 0 3px #400;background:linear-gradient(#e9b3a6,#d9826e 48%,#c4452a 52%,#d77a5f)}
.btns b:hover{filter:brightness(1.15)}
.btns .cl:hover{background:linear-gradient(#f6c2b4,#ee8f78 48%,#e0452a 52%,#f08c70)}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:se-resize}
.max .rz{display:none}
.body{flex:1;min-height:0;background:#fff;border:1px solid #5f7087;display:flex;flex-direction:column;overflow:auto}
.menu{display:flex;gap:2px;padding:2px 4px;background:linear-gradient(#fff,#f0f3f8);border-bottom:1px solid #dde3ec;flex:none}
.menu span{padding:1px 7px}.menu span:hover{background:#dbe9fb;box-shadow:inset 0 0 0 1px #aac8ef;border-radius:2px}
textarea{flex:1;border:0;outline:0;resize:none;padding:3px;font:13px Consolas,"Courier New",monospace}
.calc{background:linear-gradient(#e9eef6,#d3dded);padding:8px;height:100%}
.calc input{width:100%;height:36px;text-align:right;font:20px "Segoe UI";padding:0 6px;border:1px solid #7b8aa0;border-radius:2px;margin-bottom:8px;background:#fff}
.calc div{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.calc button{height:34px;font:14px "Segoe UI";border:1px solid #707070;border-radius:3px;background:linear-gradient(#f6f6f6 45%,#dcdcdc 50%,#cfcfcf)}
.calc button:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd 45%,#bee6fd 50%,#a7d9f5)}
.ex,.ie{display:flex;flex-direction:column;height:100%}
.addr{display:flex;gap:6px;padding:5px;background:linear-gradient(#f7f9fc,#e6ecf5);border-bottom:1px solid #c4cfdf;flex:none}
.addr em{font-style:normal;width:26px;height:22px;border-radius:50%;background:radial-gradient(#9fd2f7,#2b78c4);color:#fff;display:grid;place-items:center;flex:none}
.addr span,.addr input{flex:1;min-width:0;background:#fff;border:1px solid #9aa9bf;padding:3px 6px;font:12px "Segoe UI";outline:0}
.exm{display:flex;flex:1;min-height:0}
.side{width:150px;background:#f3f7fc;border-right:1px solid #d5deea;padding:8px;line-height:22px;color:#1e3f73;flex:none}
.side b{display:block;color:#47658f;margin-top:6px;font-weight:600}
.main{flex:1;padding:10px;overflow:auto}
.main h4{margin:6px 0;font-weight:400;font-size:12px;color:#1e3287;border-bottom:1px solid #d3dcea;padding-bottom:2px}
.fi{display:inline-flex;flex-direction:column;align-items:center;width:84px;padding:6px 2px;margin:2px;text-align:center;border:1px solid transparent;border-radius:3px}
.fi:hover,.drv:hover{background:#e9f3fd;border-color:#bcdcf7}
.drv{display:flex;flex-direction:row;gap:10px;align-items:center;padding:6px;border:1px solid transparent;width:280px;border-radius:3px}
.drv u{display:block;height:13px;width:180px;border:1px solid #888;background:linear-gradient(#e8e8e8,#d4d4d4);margin:3px 0;text-decoration:none}
.drv u s{display:block;height:100%;width:62%;background:linear-gradient(#53c1f1,#1a8fd6)}
.drv small{color:#6d6d6d}
.th{display:flex;gap:14px;flex-wrap:wrap;padding:10px}
.t{text-align:center;padding:6px;border:1px solid transparent;border-radius:3px}.t:hover{background:#e9f3fd;border-color:#bcdcf7}
.t b{display:block;width:120px;height:72px;border-radius:3px;border:1px solid #789;margin-bottom:4px}
.pg{flex:1;overflow:auto;padding:30px;background:#fff;user-select:text}
.hm{text-align:center;margin-top:40px}.hm h1{font:300 54px "Segoe UI";color:#2a6ebb;margin:0 0 20px}
.hm input{width:340px;padding:8px;border:1px solid #8aa;margin-right:6px}
.er h2{font-weight:400;color:#1f4e8c;border-bottom:1px solid #ccd}
#bar{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:9999;display:flex;align-items:center;padding-left:62px;background:linear-gradient(rgba(96,136,186,.8),rgba(34,66,112,.88) 48%,rgba(14,34,70,.92) 52%,rgba(24,58,104,.92));backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#orb{position:absolute;left:5px;bottom:-4px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:radial-gradient(circle at 50% 18%,#a8e4ff,#2d8fe0 40%,#0b3f94 78%);box-shadow:0 0 8px rgba(80,170,255,.7),inset 0 -6px 10px rgba(0,30,90,.6);display:grid;place-items:center}
#orb:hover,#orb.on{filter:brightness(1.25) saturate(1.2)}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;transform:skewY(-6deg) rotate(-3deg)}
#orb .lg{grid-template-columns:11px 11px}#orb .lg b{height:10px}
.lg b{border-radius:2px 6px 2px 6px;box-shadow:0 0 3px rgba(0,0,0,.4)}
#tasks{display:flex;gap:2px;flex:1;min-width:0}
.tk{width:46px;height:34px;display:grid;place-items:center;border-radius:3px;border:1px solid transparent}
.tk:hover{border-color:rgba(255,255,255,.45);background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.08) 50%,rgba(150,210,255,.3))}
.tk.run{border-color:rgba(255,255,255,.3);background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.06) 50%,rgba(255,255,255,.12))}
.tk.on{border-color:rgba(255,255,255,.6);background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.2) 50%,rgba(190,230,255,.38))}
#tray{display:flex;align-items:center;gap:9px;color:#fff;height:100%;text-shadow:0 0 3px #000}
#clk{text-align:center;line-height:14px;padding:0 4px}
#show{width:14px;height:100%;border-left:1px solid rgba(255,255,255,.5);background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.28))}
#show:hover{background:rgba(255,255,255,.5)}
#cal,#ctx,#pw{position:fixed;display:none;z-index:10001;color:#fff;border:1px solid rgba(255,255,255,.5);background:rgba(25,45,75,.88);backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(0,0,0,.6)}
#cal{right:4px;bottom:42px;width:220px;padding:10px;border-radius:6px 6px 0 0}
#cal .ch{font-size:13px;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg i{font-style:normal;padding:3px 0}.cg b{opacity:.6;font-weight:400}
.cg .td{background:linear-gradient(#5aa9ee,#1c64b8);border-radius:2px}
#ctx{width:190px;padding:3px;background:rgba(246,248,252,.97);color:#000;border-color:#979fa8;border-radius:3px;box-shadow:3px 3px 8px rgba(0,0,0,.4)}
#ctx div{padding:4px 22px;border:1px solid transparent}#ctx div:hover{background:linear-gradient(#f4f9ff,#d4e6fa);border-color:#a8cdf2}
#ctx hr{border:0;border-top:1px solid #d8dde4;margin:3px 2px}
#sm{position:fixed;left:3px;bottom:40px;width:410px;height:470px;z-index:10000;display:none;padding:6px;gap:6px;border-radius:8px 8px 0 0;border:1px solid rgba(0,0,0,.6);background:linear-gradient(rgba(120,170,225,.72),rgba(50,100,170,.8));backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 26px rgba(0,0,0,.55);grid-template-columns:1fr 150px;grid-template-rows:1fr auto}
#sm.open{display:grid}
.pl{background:#fff;border-radius:4px;border:1px solid #8aa3c4;padding:4px;display:flex;flex-direction:column;overflow:auto}
#lst{flex:1}
.pl [data-k],.pr [data-k],#all{display:flex;align-items:center;gap:8px;padding:5px 6px;border:1px solid transparent;border-radius:3px}
.pl [data-k]:hover,#all:hover{background:linear-gradient(#f4f9ff,#d7e9fb);border-color:#b8d6f5}
#all{border-top:1px solid #d5dde9;font-weight:600;border-radius:0}
.pr{color:#fff;padding:4px 0;text-shadow:0 0 3px rgba(0,30,80,.7)}
.pr [data-k]{padding:7px 8px}.pr [data-k]:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.5)}
.av{width:52px;height:52px;margin:6px auto 10px;border:2px solid rgba(255,255,255,.8);border-radius:4px;background:radial-gradient(circle at 50% 36%,#ffe3b0 0 15%,transparent 16%),radial-gradient(ellipse at 50% 100%,#e8f0fa 0 42%,transparent 43%),linear-gradient(#78b7ee,#2f6fb8)}
.sr{grid-column:1/3;display:flex;gap:6px;position:relative}
.sr input{flex:1;border:1px solid #6c86a8;border-radius:3px;padding:5px 8px;font:italic 12px "Segoe UI";outline:0}
.sr button{color:#fff;font:12px "Segoe UI";border:1px solid rgba(0,0,0,.55);border-radius:3px;background:linear-gradient(#5a7396,#2b4268 50%,#1a2f52 52%,#2c4a78);padding:0 14px}
.sr button:hover{background:linear-gradient(#7791b8,#3d5a8c 50%,#2a4574 52%,#3f66a2)}
#shut{width:110px}#ar{padding:0 7px}
#pw{right:0;bottom:30px;width:110px;padding:3px;border-radius:3px}#pw div{padding:5px 10px}#pw div:hover{background:rgba(255,255,255,.25)}
#boot{position:fixed;inset:0;z-index:30000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;font:300 28px "Segoe UI",sans-serif;transition:opacity .7s}
#boot.b2{background:radial-gradient(ellipse at 50% 120%,#34b4d4,#0b6a98 45%,#063a63)}
#boot .lg{grid-template-columns:46px 46px;gap:4px;animation:glow 2.4s infinite}#boot .lg b{height:42px}
#boot p{margin:30px 0 0;font-size:18px}
@keyframes glow{50%{filter:brightness(1.7) drop-shadow(0 0 16px #6cf)}}
</style>
</head>
<body>
<div id="desk"><div id="icons"></div></div>
<div id="sm">
 <div class="pl"><div id="lst"></div><div id="all">&#9656; All Programs</div></div>
 <div class="pr" id="pr"><div class="av"></div>
  <div data-k="fld" data-n="Documents">Documents</div><div data-k="fld" data-n="Pictures">Pictures</div><div data-k="fld" data-n="Music">Music</div><div data-k="pc">Computer</div><div data-k="cp">Control Panel</div><div data-k="fld" data-n="Devices and Printers">Devices and Printers</div><div data-k="pers">Personalization</div></div>
 <div class="sr"><input id="q" placeholder="Search programs and files"><button id="shut">Shut down</button><button id="ar">&#9656;</button><div id="pw"><div id="rs">Restart</div></div></div>
</div>
<div id="bar">
 <div id="orb"><div class="lg"><b style="background:#f25022"></b><b style="background:#7fba00"></b><b style="background:#00a4ef"></b><b style="background:#ffb900"></b></div></div>
 <div id="tasks"></div>
 <div id="tray"><span>&#9650;</span>
  <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 13h2V10H2zM6 13h2V7H6zM10 13h2V4h-2z" fill="#fff"/></svg>
  <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#fff"/><path d="M11 5q2 3 0 6" stroke="#fff" fill="none"/></svg>
  <div id="clk"></div><div id="show"></div></div>
</div>
<div id="cal"></div>
<div id="ctx"><div>View</div><div>Sort by</div><div id="rf">Refresh</div><hr><div id="nf">New folder</div><hr><div>Screen resolution</div><div>Gadgets</div><div id="ps">Personalize</div></div>
<div id="boot"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={
folder:'<path d="M3 8h10l3 3h13v16H3z" fill="#e0a92e"/><path d="M3 13h26v14H3z" fill="#f8d56b"/>',
pc:'<rect x="3" y="4" width="26" height="18" rx="2" fill="#3b4a5e"/><rect x="5" y="6" width="22" height="14" fill="#5ab4ee"/><path d="M12 24h8l2 4H10z" fill="#9aa7b8"/>',
bin:'<path d="M8 8h16l-2 20H10z" fill="#cfe3f3" stroke="#6d8aa5"/><rect x="6" y="5" width="20" height="3" rx="1" fill="#9db6cb"/><path d="M12 12v13M16 12v13M20 12v13" stroke="#7fa0bd"/>',
np:'<rect x="6" y="3" width="20" height="26" rx="2" fill="#fff" stroke="#6d8aa5"/><rect x="6" y="3" width="20" height="5" fill="#4a86c7"/><path d="M10 12h12M10 16h12M10 20h12M10 24h8" stroke="#4a86c7"/>',
calc:'<rect x="6" y="3" width="20" height="26" rx="2" fill="#b8c2cf" stroke="#5c6b7d"/><rect x="9" y="6" width="14" height="6" fill="#bfe8c8"/><path d="M10 16h3M15 16h3M20 16h3M10 20h3M15 20h3M20 20h3M10 24h3M15 24h3M20 24h3" stroke="#3a4757" stroke-width="2.5"/>',
ie:'<circle cx="16" cy="16" r="12" fill="#2d8ee8"/><text x="16" y="23" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="Georgia">e</text><ellipse cx="16" cy="16" rx="15" ry="5" fill="none" stroke="#ffd447" stroke-width="2" transform="rotate(-25 16 16)"/>',
cp:'<circle cx="16" cy="16" r="10" fill="#7da6d6" stroke="#46698f" stroke-width="3" stroke-dasharray="4 2"/><circle cx="16" cy="16" r="4" fill="#fff"/>',
txt:'<path d="M8 3h11l6 6v20H8z" fill="#fff" stroke="#6d8aa5"/><path d="M11 14h11M11 18h11M11 22h8" stroke="#8aa"/>',
disk:'<rect x="3" y="11" width="26" height="12" rx="2" fill="#aab4c2" stroke="#5c6b7d"/><circle cx="25" cy="17" r="1.5" fill="#6f6"/>',
dvd:'<circle cx="16" cy="16" r="12" fill="#c9d1da" stroke="#7a8794"/><circle cx="16" cy="16" r="3" fill="#fff" stroke="#7a8794"/>'};
I.pers=I.cp;I.fld=I.folder;
const ico=(k,s=32)=>`<svg viewBox="0 0 32 32" width="${s}" height="${s}">${I[k]}</svg>`;
let z=10,n=0;
const LG='<div class="lg"><b style="background:#f25022"></b><b style="background:#7fba00"></b><b style="background:#00a4ef"></b><b style="background:#ffb900"></b></div>';
const TXT={'Read me.txt':'Welcome to Windows 7 (browser edition).\n\nTry this:\n- Right-click the desktop\n- Drag the icons around\n- Open Internet Explorer\n- Click the clock\n- Hover the strip at the far right of the taskbar'};
const side='<b>Favorites</b>Desktop<br>Downloads<br>Recent Places<b>Libraries</b>Documents<br>Music<br>Pictures<br>Videos<b>Computer</b>Local Disk (C:)<b>Network</b>';
const fi=(k,t,f)=>`<div class="fi" data-k="${f||'fld'}" data-n="${t}">${ico(k,40)}<span>${t}</span></div>`;
const ex=(a,m)=>`<div class="ex"><div class="addr"><em>&#9664;</em><em>&#9654;</em><span>${a}</span></div><div class="exm"><div class="side">${side}</div><div class="main">${m}</div></div></div>`;
const FC={'Local Disk (C:)':['Program Files','Users','Windows','PerfLogs'].map(x=>fi('folder',x)).join(''),Documents:fi('txt','Read me.txt','np'),Users:fi('folder','User')};
const empty='<h4>This folder is empty.</h4>';
const A={
 pc:()=>({t:'Computer',i:'pc',w:700,h:430,html:ex('Computer',`<h4>Hard Disk Drives (1)</h4><div class="drv fi" data-k="fld" data-n="Local Disk (C:)">${ico('disk',40)}<div style="text-align:left">Local Disk (C:)<u><s></s></u><small>88.4 GB free of 232 GB</small></div></div><h4>Devices with Removable Storage (1)</h4><div class="drv">${ico('dvd',40)}<div>DVD RW Drive (D:)</div></div>`)}),
 fld:o=>({t:o.n,i:'folder',w:620,h:400,html:ex('Computer &#9656; '+o.n,FC[o.n]||empty)}),
 bin:()=>({t:'Recycle Bin',i:'bin',w:620,h:380,html:ex('Recycle Bin',empty)}),
 cp:()=>({t:'Control Panel',i:'cp',w:640,h:380,html:ex('Control Panel','<h4>Adjust your computer\'s settings</h4><p>System and Security<br>Network and Internet<br>Hardware and Sound<br>Programs<br>User Accounts</p><div class="fi" data-k="pers" style="width:auto;padding:4px 8px;color:#06c">Appearance and Personalization</div>')}),
 pers:()=>({t:'Personalization',i:'cp',w:560,h:330,html:`<div class="main"><h4>Change the visuals and sounds on your computer</h4><div class="th">${['Windows 7','Harmony','Sunset','Midnight'].map((x,i)=>`<div class="t" data-i="${i}"><b class="p${i}"></b>${x}</div>`).join('')}</div></div>`,init(e){e.onclick=v=>{const t=v.target.closest('.t');if(t)document.body.className='w'+t.dataset.i}}}),
 np:o=>({t:(o.n||'Untitled')+' - Notepad',i:'np',w:540,h:360,html:'<div class="menu"><span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Help</span></div><textarea spellcheck="false"></textarea>',init(e){$('textarea',e).value=TXT[o.n]||''}}),
 calc:()=>({t:'Calculator',i:'calc',w:260,h:330,html:'<div class="calc"><input value="0" readonly><div></div></div>',init(e){
  const d=$('.calc div',e),o=$('input',e);let s='';
  ['C','←','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].forEach(k=>{
   const b=document.createElement('button');b.textContent=k;b.onclick=()=>{
    if(k=='C')s='';else if(k=='←')s=s.slice(0,-1);
    else if(k=='='){try{s=String(+Function('return '+s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-'))().toFixed(10))}catch(_){s='Error'}}
    else{if(s=='Error')s='';s+=k}o.value=s||'0'};d.appendChild(b)})}}),
 ie:()=>({t:'Windows Internet Explorer',i:'ie',w:760,h:480,html:'<div class="ie"><div class="addr"><em>&#9664;</em><em>&#9654;</em><input class="u"><em class="rf">&#8635;</em></div><div class="pg"></div></div>',init(e){
